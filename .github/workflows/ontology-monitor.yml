name: Ontology coverage monitor

# Checks the AWS "What's New" feed for services/features not yet in the
# ontology and opens a PR proposing draft additions for human review. Never
# touches ontology/aws.ttl directly — see tools/propose_ontology_updates.py.
#
# Requires an OPENAI_API_KEY or ANTHROPIC_API_KEY repo secret (Claude is used if
# both are set). Without one, this workflow fails loudly on every scheduled run
# rather than silently doing nothing — add a secret (Settings -> Secrets and
# variables -> Actions) to enable it. An optional OPENAI_MODEL repo variable
# overrides the default OpenAI model, and an optional MONITOR_ASSIGNEE variable
# overrides who the PR is assigned to (default plosiewicz).

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly, Monday 09:00 UTC
  workflow_dispatch: {} # Manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  check-for-updates:
    # Run only in the primary repository; mirrors would open duplicate PRs and spend API credits.
    if: github.repository == 'arango-solutions-org/aws-ontology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group monitor

      - name: Check for new AWS services
        id: monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: uv run python tools/propose_ontology_updates.py --days 8

      - name: Open PR with findings
        if: steps.monitor.outputs.findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_PATH: ${{ steps.monitor.outputs.proposal_path }}
          ASSIGNEE: ${{ vars.MONITOR_ASSIGNEE || 'plosiewicz' }}
        run: |
          # Run number and attempt keep a manual and a scheduled run on the same day, and a
          # re-run of a failed run, from colliding on the branch name.
          LABEL="$(date +%Y-%m-%d) run ${GITHUB_RUN_NUMBER}"
          BRANCH="ontology-proposal/$(date +%Y-%m-%d)-run${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "ontology-monitor[bot]"
          git config user.email "ontology-monitor[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$PROPOSAL_PATH"
          git commit -m "docs: proposed ontology coverage additions (${LABEL})"
          git push origin "$BRANCH"
          gh pr create \
            --title "Ontology coverage proposal: ${LABEL}" \
            --body "Automated findings from the AWS \"What's New\" feed. Draft proposals only — review, verify ARN formats, and integrate into \`ontology/aws.ttl\` manually (with tests + SHACL validation) before merging." \
            --label "ontology-proposal" \
            --assignee "$ASSIGNEE"
